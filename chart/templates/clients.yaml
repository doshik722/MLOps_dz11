{{- range $i := until 4 }}
---
apiVersion: v1
kind: Pod
metadata:
  name: client-{{ $i }}
  labels: {app: client}
spec:
  containers:
    - name: client
      image: {{ $.Values.image | quote }}
      imagePullPolicy: IfNotPresent
      command: [python, loadgen.py, --agent]
      ports: [{containerPort: 8090}]
      resources:
        requests: {cpu: 50m, memory: 48Mi}
        limits: {cpu: 250m, memory: 128Mi}
{{- end }}
