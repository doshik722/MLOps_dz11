{{- $artifact := printf "{\"backend_mode\":\"simulated\",\"version\":\"%s\",\"seed\":42}" .Values.modelVersion }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: model-{{ .Values.modelVersion | lower }}
data:
  model.json: {{ $artifact | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
data:
  WARMUP_SECONDS: {{ .Values.warmupSeconds | quote }}
  MODEL_VERSION: {{ .Values.modelVersion | quote }}
  ARTIFACT_SHA256: {{ $artifact | sha256sum | quote }}
  FAIL_LOAD: {{ .Values.failLoad | quote }}
  MAX_RUNNING: {{ .Values.maxRunning | quote }}
  MAX_WAITING: {{ .Values.maxWaiting | quote }}
  CACHE_CAPACITY: {{ .Values.cacheCapacity | quote }}
  HIT_CPU_SECONDS: {{ .Values.hitCpuSeconds | quote }}
  MISS_CPU_SECONDS: {{ .Values.missCpuSeconds | quote }}
  CHUNK_CPU_SECONDS: {{ .Values.chunkCpuSeconds | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  {{- if not .Values.hpa.enabled }}
  replicas: {{ .Values.replicas }}
  {{- end }}
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 180
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api}
      annotations:
        config-hash: {{ printf "%s:%v:%v:%v:%v:%v:%v:%v:%v" $artifact .Values.warmupSeconds .Values.failLoad .Values.maxRunning .Values.maxWaiting .Values.cacheCapacity .Values.hitCpuSeconds .Values.missCpuSeconds .Values.chunkCpuSeconds | sha256sum }}
        prometheus.io/scrape: "true"
    spec:
      terminationGracePeriodSeconds: 75
      containers:
        - name: api
          image: {{ .Values.image | quote }}
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8080}]
          envFrom: [{configMapRef: {name: api-config}}]
          env:
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
          resources: {{ .Values.resources | toJson }}
          volumeMounts: [{name: artifact, mountPath: /artifact, readOnly: true}]
          startupProbe:
            httpGet: {path: {{ if .Values.brokenProbes }}/health{{ else }}/startup{{ end }}, port: http}
            periodSeconds: 1
            timeoutSeconds: 1
            failureThreshold: 90
          readinessProbe:
            httpGet: {path: {{ if .Values.brokenProbes }}/health{{ else }}/ready{{ end }}, port: http}
            periodSeconds: 1
            timeoutSeconds: 1
            failureThreshold: 1
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
          lifecycle:
            preStop:
              exec:
                command: [python, -c, "import urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8080/drain',method='POST'),timeout=10).read()"]
      volumes:
        - name: artifact
          configMap: {name: model-{{ .Values.modelVersion | lower }}}
---
apiVersion: v1
kind: Service
metadata: {name: api}
spec:
  selector: {app: api}
  ports: [{name: http, port: 8080, targetPort: http}]
  sessionAffinity: None
---
apiVersion: v1
kind: Service
metadata: {name: api-sticky}
spec:
  selector: {app: api}
  ports: [{name: http, port: 8080, targetPort: http}]
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP: {timeoutSeconds: 10800}
---
apiVersion: v1
kind: Service
metadata: {name: api-headless}
spec:
  clusterIP: None
  selector: {app: api}
  ports: [{name: http, port: 8080, targetPort: http}]
{{- if .Values.hpa.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: api}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: api}
  minReplicas: 2
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: {{ .Values.hpa.targetCPU }}}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies: [{type: Pods, value: 1, periodSeconds: 15}]
    scaleDown:
      stabilizationWindowSeconds: {{ .Values.hpa.downWindowSeconds }}
      policies: [{type: Pods, value: 1, periodSeconds: 15}]
{{- end }}
