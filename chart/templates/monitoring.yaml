apiVersion: v1
kind: ServiceAccount
metadata: {name: monitoring}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: hw11-monitoring}
rules:
  - apiGroups: [""]
    resources: [pods, nodes, nodes/proxy, services, endpoints, namespaces, replicationcontrollers, resourcequotas, limitranges, persistentvolumes, persistentvolumeclaims]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets, statefulsets, daemonsets]
    verbs: [get, list, watch]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: hw11-monitoring}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: hw11-monitoring}
subjects: [{kind: ServiceAccount, name: monitoring, namespace: {{ .Release.Namespace }}}]
---
apiVersion: v1
kind: ConfigMap
metadata: {name: prometheus-config}
data:
  prometheus.yml: |
    global:
      scrape_interval: 2s
      evaluation_interval: 5s
    rule_files: [/etc/prometheus/alerts.yml]
    scrape_configs:
      - job_name: api
        kubernetes_sd_configs:
          - role: pod
            namespaces: {names: [{{ .Release.Namespace }}]}
        relabel_configs:
          - {source_labels: [__meta_kubernetes_pod_label_app], regex: api, action: keep}
          - {source_labels: [__meta_kubernetes_pod_container_port_number], regex: '8080', action: keep}
          - {source_labels: [__meta_kubernetes_pod_name], target_label: pod}
      - job_name: state
        static_configs: [{targets: ['state:8080']}]
      - job_name: cadvisor
        scheme: https
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config: {insecure_skip_verify: true}
        kubernetes_sd_configs: [{role: node}]
        relabel_configs:
          - {target_label: __address__, replacement: 'kubernetes.default.svc:443'}
          - source_labels: [__meta_kubernetes_node_name]
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor
  alerts.yml: |
    groups:
      - name: hw11
        rules:
          - alert: HighTTFC
            expr: histogram_quantile(0.95, sum by(le) (rate(api_ttfc_seconds_bucket[30s]))) > 0.8 and sum(increase(api_ttfc_seconds_count[30s])) >= 20
            for: 15s
            labels: {severity: warning}
            annotations: {summary: 'p95 TTFC > 0.8 s; минимум 20 наблюдений за 30 s'}
          - alert: HighRejectionRatio
            expr: sum(rate(api_requests_total{outcome="rejected"}[30s])) / sum(rate(api_requests_total[30s])) > 0.1 and sum(increase(api_requests_total[30s])) >= 20
            for: 15s
            labels: {severity: warning}
            annotations: {summary: 'Отказов > 10%; минимум 20 исходов за 30 s'}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: prometheus}
spec:
  replicas: 1
  selector: {matchLabels: {app: prometheus}}
  template:
    metadata: {labels: {app: prometheus}}
    spec:
      serviceAccountName: monitoring
      securityContext: {fsGroup: 65534}
      containers:
        - name: prometheus
          image: {{ .Values.monitoring.prometheusImage | quote }}
          args: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.path=/prometheus, --storage.tsdb.retention.time=2h, --storage.tsdb.retention.size=128MB, --web.enable-lifecycle]
          ports: [{containerPort: 9090}]
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 500m, memory: 384Mi}}
          volumeMounts: [{name: config, mountPath: /etc/prometheus}, {name: data, mountPath: /prometheus}]
      volumes:
        - name: config
          configMap: {name: prometheus-config}
        - name: data
          emptyDir: {sizeLimit: 256Mi}
---
apiVersion: v1
kind: Service
metadata: {name: prometheus}
spec: {selector: {app: prometheus}, ports: [{port: 9090}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: state}
spec:
  replicas: 1
  selector: {matchLabels: {app: state}}
  template:
    metadata: {labels: {app: state}}
    spec:
      serviceAccountName: monitoring
      containers:
        - name: state
          image: {{ .Values.monitoring.stateImage | quote }}
          args: ["--resources=pods,deployments,horizontalpodautoscalers"]
          ports: [{containerPort: 8080}]
          resources: {requests: {cpu: 50m, memory: 32Mi}, limits: {cpu: 200m, memory: 96Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: state}
spec: {selector: {app: state}, ports: [{port: 8080}]}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: grafana-provisioning}
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        url: http://prometheus:9090
        access: proxy
        isDefault: true
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: hw11
        type: file
        options: {path: /dashboards}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: grafana-dashboard}
data:
  hw11.json: {{ .Files.Get "dashboards/hw11.json" | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: grafana}
spec:
  replicas: 1
  selector: {matchLabels: {app: grafana}}
  template:
    metadata: {labels: {app: grafana}}
    spec:
      securityContext: {fsGroup: 472}
      containers:
        - name: grafana
          image: {{ .Values.monitoring.grafanaImage | quote }}
          env:
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: 'true'}
            - {name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: Viewer}
            - {name: GF_ANALYTICS_REPORTING_ENABLED, value: 'false'}
            - {name: GF_ANALYTICS_CHECK_FOR_UPDATES, value: 'false'}
          ports: [{containerPort: 3000}]
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 400m, memory: 256Mi}}
          volumeMounts:
            - {name: provisioning, mountPath: /etc/grafana/provisioning/datasources/datasource.yaml, subPath: datasource.yaml}
            - {name: provisioning, mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml, subPath: dashboards.yaml}
            - {name: dashboard, mountPath: /dashboards}
            - {name: data, mountPath: /var/lib/grafana}
      volumes:
        - {name: provisioning, configMap: {name: grafana-provisioning}}
        - {name: dashboard, configMap: {name: grafana-dashboard}}
        - {name: data, emptyDir: {sizeLimit: 128Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: grafana}
spec: {selector: {app: grafana}, ports: [{port: 3000}]}
