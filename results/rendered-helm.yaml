apiVersion: apps/v1
kind: Deployment
metadata: {name: grafana}
spec:
  replicas: 1
  selector: {matchLabels: {app: grafana}}
  template:
    metadata: {labels: {app: grafana}}
    spec:
      securityContext: {fsGroup: 472}
      containers:
        - name: grafana
          image: "grafana/grafana:12.1.1"
          env:
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: 'true'}
            - {name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: Viewer}
            - {name: GF_ANALYTICS_REPORTING_ENABLED, value: 'false'}
            - {name: GF_ANALYTICS_CHECK_FOR_UPDATES, value: 'false'}
          ports: [{containerPort: 3000}]
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 400m, memory: 256Mi}}
          volumeMounts:
            - {name: provisioning, mountPath: /etc/grafana/provisioning/datasources/datasource.yaml, subPath: datasource.yaml}
            - {name: provisioning, mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml, subPath: dashboards.yaml}
            - {name: dashboard, mountPath: /dashboards}
            - {name: data, mountPath: /var/lib/grafana}
      volumes:
        - {name: provisioning, configMap: {name: grafana-provisioning}}
        - {name: dashboard, configMap: {name: grafana-dashboard}}
        - {name: data, emptyDir: {sizeLimit: 128Mi}}
