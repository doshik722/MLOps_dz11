# Source: hw11/templates/monitoring.yaml
apiVersion: v1
kind: ConfigMap
metadata: {name: prometheus-config}
data:
  prometheus.yml: |
    global:
      scrape_interval: 2s
      evaluation_interval: 5s
    rule_files: [/etc/prometheus/alerts.yml]
    scrape_configs:
      - job_name: api
        kubernetes_sd_configs:
          - role: pod
            namespaces: {names: [hw11]}
        relabel_configs:
          - {source_labels: [__meta_kubernetes_pod_label_app], regex: api, action: keep}
          - {source_labels: [__meta_kubernetes_pod_container_port_number], regex: '8080', action: keep}
          - {source_labels: [__meta_kubernetes_pod_name], target_label: pod}
      - job_name: state
        static_configs: [{targets: ['state:8080']}]
      - job_name: cadvisor
        scheme: https
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config: {insecure_skip_verify: true}
        kubernetes_sd_configs: [{role: node}]
        relabel_configs:
          - {target_label: __address__, replacement: 'kubernetes.default.svc:443'}
          - source_labels: [__meta_kubernetes_node_name]
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor
  alerts.yml: |
    groups:
      - name: hw11
        rules:
          - alert: HighTTFC
            expr: histogram_quantile(0.95, sum by(le) (rate(api_ttfc_seconds_bucket[30s]))) > 0.8 and sum(increase(api_ttfc_seconds_count[30s])) >= 20
            for: 15s
            labels: {severity: warning}
            annotations: {summary: 'p95 TTFC > 0.8 s; минимум 20 наблюдений за 30 s'}
          - alert: HighRejectionRatio
            expr: sum(rate(api_requests_total{outcome="rejected"}[30s])) / sum(rate(api_requests_total[30s])) > 0.1 and sum(increase(api_requests_total[30s])) >= 20
            for: 15s
            labels: {severity: warning}
            annotations: {summary: 'Отказов > 10%; минимум 20 исходов за 30 s'}
