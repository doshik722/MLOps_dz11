apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 2
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 180
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api}
      annotations:
        config-hash: 3ba753250b47bde00a07a2b9776ef7683a7d1ab8d7aecd4b06c67513e3df7d87
        prometheus.io/scrape: "true"
    spec:
      terminationGracePeriodSeconds: 75
      containers:
        - name: api
          image: "hw11-api:0.1.0"
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8080}]
          envFrom: [{configMapRef: {name: api-config}}]
          env:
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
          resources: {"limits":{"cpu":"600m","memory":"192Mi"},"requests":{"cpu":"250m","memory":"80Mi"}}
          volumeMounts: [{name: artifact, mountPath: /artifact, readOnly: true}]
          startupProbe:
            httpGet: {path: /startup, port: http}
            periodSeconds: 1
            timeoutSeconds: 1
            failureThreshold: 90
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 1
            timeoutSeconds: 1
            failureThreshold: 1
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
          lifecycle:
            preStop:
              exec:
                command: [python, -c, "import urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8080/drain',method='POST'),timeout=10).read()"]
      volumes:
        - name: artifact
          configMap: {name: model-a}
